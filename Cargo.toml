[package]
name = "pratrol"
version = "0.1.0"
edition = "2024"
authors = ["ljahier <lucas.jahier@stratorys.com>", "sehnryr <youn@melois.dev>"]
description = "Pratrol, your intelligent PR triage for modern maintainers."
license = "MPL-2.0"

[dependencies]
ammonia = "4.1.3"
askama_escape = "0.16.0"
async-trait = "0.1.89"
axum = "0.8.9"
chrono = "0.4.45"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.4.2"
http-body-util = "0.1.3"
jsonwebtoken = "10.4.0"
octocrab = "0.54.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["v4"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
cargo      = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
pedantic   = { level = "deny", priority = -1 }
perf       = { level = "deny", priority = -1 }
style      = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

allow_attributes_without_reason = "deny"
missing_assert_message = "deny"
missing_docs_in_private_items = "deny"
multiple_crate_versions = "allow"
self_named_module_files = "deny"
semicolon_outside_block = "deny"
single_char_lifetime_names = "deny"
str_to_string = "deny"
undocumented_unsafe_blocks = "deny"
unseparated_literal_suffix = "deny"
unwrap_used = "deny"

[dev-dependencies]
mockall = "0.15.0"
tower = { version = "0.5.3", features = ["util"] }
