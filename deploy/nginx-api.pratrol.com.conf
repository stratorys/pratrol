upstream pratrol {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name api.pratrol.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.pratrol.com;

    ssl_certificate     /etc/letsencrypt/live/api.pratrol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pratrol.com/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Webhook payloads can be up to 25 MB
    client_max_body_size 25m;

    location / {
        proxy_pass http://pratrol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GitHub webhooks timeout after 10s, keep proxy timeout reasonable
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 5s;
    }
}
